<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="몬테카를로 시뮬레이션 우승 확률 계산 원리 — 시즌 5,000번 반복해 우승 횟수를 세는 과정">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#bg2)"/>
<text x="60" y="80" fill="#ffffff" font-size="40" font-weight="900" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">우승 확률 = 5,000번 시즌을 돌려 1위로 마친 횟수 ÷ 5,000</text>
<g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect x="60" y="140" width="330" height="200" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="225" y="185" fill="#67e8f9" font-size="22" font-weight="800" text-anchor="middle">① 팀 전력 = Elo 레이팅</text>
<text x="225" y="225" fill="#e5e7eb" font-size="19" text-anchor="middle">아스널 1665 · 맨시티 1645</text>
<text x="225" y="255" fill="#cbd5e1" font-size="17" text-anchor="middle">경기마다 승·무·패 확률로 변환</text>
<text x="225" y="285" fill="#cbd5e1" font-size="17" text-anchor="middle">홈 이점 · 최근 흐름 반영</text>
<text x="415" y="250" fill="#64748b" font-size="40">→</text>
<rect x="450" y="140" width="330" height="200" rx="18" fill="#1e293b" stroke="#334155"/>
<text x="615" y="185" fill="#67e8f9" font-size="22" font-weight="800" text-anchor="middle">② 잔여 350경기 주사위</text>
<text x="615" y="225" fill="#e5e7eb" font-size="19" text-anchor="middle">확률대로 결과를 무작위 추출</text>
<text x="615" y="255" fill="#cbd5e1" font-size="17" text-anchor="middle">시즌 끝까지 → 최종 순위표 1장</text>
<text x="615" y="285" fill="#cbd5e1" font-size="17" text-anchor="middle">이걸 5,000번 반복</text>
<text x="805" y="250" fill="#64748b" font-size="40">→</text>
<rect x="840" y="140" width="300" height="200" rx="18" fill="#0e7490" stroke="#22d3ee"/>
<text x="990" y="185" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle">③ 1위 횟수를 센다</text>
<text x="990" y="230" fill="#ffffff" font-size="19" text-anchor="middle">아스널 1위 약 1015회</text>
<text x="990" y="260" fill="#ffffff" font-size="19" text-anchor="middle">÷ 5,000 = 20.3%</text>
<text x="990" y="295" fill="#a5f3fc" font-size="16" text-anchor="middle">같은 표에서 Top 4 · 강등 확률도 나옴</text>
<text x="60" y="420" fill="#ffffff" font-size="26" font-weight="800">읽을 때 기억할 것</text>
<text x="60" y="465" fill="#e5e7eb" font-size="20">· 20%는 "5번 중 1번 우승" — 80%는 다른 팀이 우승하는 시나리오</text>
<text x="60" y="505" fill="#e5e7eb" font-size="20">· 완료 20경기 미만이면 계산하지 않음 (표본 부족 극단값 방지)</text>
<text x="60" y="545" fill="#e5e7eb" font-size="20">· 잔여 일정 데이터가 비면 우승 확률을 감춤 (99.9% 오보 방지)</text>
<text x="60" y="585" fill="#e5e7eb" font-size="20">· 매 라운드 결과가 들어오면 확률이 다시 계산됨 (1시간 갱신)</text>
<text x="60" y="640" fill="#64748b" font-size="17">scorebase.kr · 리그 허브 예측 탭 · /predictions/EPL</text>
