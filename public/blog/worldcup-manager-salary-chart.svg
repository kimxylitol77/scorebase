  <!-- 3 포체티노 90 -->
  <text x="270" y="231" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">포체티노 · 미국</text>
  <rect x="290" y="215" width="306" height="26" rx="5" fill="url(#bar)"/>
  <text x="608" y="235" fill="#0f172a" font-size="19" font-weight="800">90</text>
  <!-- 4 나겔스만 84 -->
  <text x="270" y="279" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">나겔스만 · 독일</text>
  <rect x="290" y="263" width="286" height="26" rx="5" fill="url(#bar)"/>
  <text x="588" y="283" fill="#0f172a" font-size="19" font-weight="800">84</text>
  <!-- 5 칸나바로 70 -->
  <text x="270" y="327" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">칸나바로 · 우즈베키스탄</text>
  <rect x="290" y="311" width="238" height="26" rx="5" fill="url(#bar)"/>
  <text x="540" y="331" fill="#0f172a" font-size="19" font-weight="800">70</text>
  <!-- 6 마르티네스 70 -->
  <text x="270" y="375" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">마르티네스 · 포르투갈</text>
  <rect x="290" y="359" width="238" height="26" rx="5" fill="url(#bar)"/>
  <text x="540" y="379" fill="#0f172a" font-size="19" font-weight="800">70</text>
  <!-- 7 데샴 66 -->
  <text x="270" y="423" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">데샴 · 프랑스</text>
