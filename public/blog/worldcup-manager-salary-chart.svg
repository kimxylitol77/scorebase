<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="barKr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="40" y="50" fill="#0f172a" font-size="30" font-weight="800">2026 월드컵 감독 연봉 TOP 8 + 홍명보</text>
  <text x="40" y="82" fill="#64748b" font-size="17">단위: 억원(추정) · 막대 끝 수치는 연 추정 연봉 · £1≈2,000원 환산</text>

  <!-- rows: x label end 270, bar start 290, scale 3.4px/억 -->
  <!-- 1 안첼로티 166 -->
  <text x="270" y="135" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">안첼로티 · 브라질</text>
  <rect x="290" y="119" width="564" height="26" rx="5" fill="url(#bar)"/>
  <text x="866" y="139" fill="#0f172a" font-size="19" font-weight="800">166</text>
  <!-- 2 투헬 102 -->
  <text x="270" y="183" fill="#0f172a" font-size="19" font-weight="700" text-anchor="end">투헬 · 잉글랜드</text>
  <rect x="290" y="167" width="347" height="26" rx="5" fill="url(#bar)"/>
