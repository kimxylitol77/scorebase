<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="축구 페널티 박스 xG 기대득점 확률 존 시각화">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#15673a"/>
    </linearGradient>
    <radialGradient id="xg" cx="50%" cy="14%" r="62%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.92"/>
      <stop offset="22%" stop-color="#f59e0b" stop-opacity="0.82"/>
      <stop offset="45%" stop-color="#eab308" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#pitch)"/>
  <g opacity="0.06" fill="#ffffff">
    <rect x="0" y="0" width="1200" height="79"/>
    <rect x="0" y="158" width="1200" height="79"/>
    <rect x="0" y="316" width="1200" height="79"/>
    <rect x="0" y="474" width="1200" height="79"/>
  </g>

  <!-- xG 확률 존 (골문에서 멀어질수록 낮아짐) -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#xg)"/>

  <!-- 필드 마킹 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4">
    <!-- 골 라인 -->
    <line x1="60" y1="40" x2="1140" y2="40"/>
    <!-- 페널티 박스 -->
    <rect x="330" y="40" width="540" height="270"/>
    <!-- 골 에어리어 -->
    <rect x="500" y="40" width="200" height="110"/>
    <!-- 페널티 아크 -->
    <path d="M 470 310 A 150 150 0 0 0 730 310" stroke-opacity="0.85"/>
  </g>
  <!-- 골대 -->
  <rect x="510" y="20" width="180" height="20" fill="#ffffff" fill-opacity="0.95"/>
  <!-- 페널티 스폿 -->
  <circle cx="600" cy="235" r="7" fill="#ffffff"/>

  <!-- 슛 궤적 -->
  <path d="M 600 470 Q 560 230 600 60" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- 공 -->
  <g transform="translate(600,470)">
    <circle r="26" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <path d="M0,-26 l8,8 -3,11 -10,0 -3,-11 z" fill="#0f172a"/>
    <circle r="26" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-opacity="0.35"/>
  </g>
</svg>
