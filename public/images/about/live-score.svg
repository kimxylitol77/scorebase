<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스코어베이스 라이브 스코어 — 라인업·승률 곡선·라이브 배당">
  <defs>
    <linearGradient id="ls-bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ls-card" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1a2b"/>
      <stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <linearGradient id="ls-win" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891b2"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ls-area" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="600" rx="28" fill="url(#ls-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="27.5" stroke="#1b2a3d" stroke-opacity="0.6"/>

  <!-- 헤더: LIVE 배지 + 리그 -->
  <g transform="translate(56,48)">
    <circle cx="9" cy="9" r="6" fill="#ef4444"/>
    <circle cx="9" cy="9" r="6" fill="#ef4444" opacity="0.35">
      <animate attributeName="r" values="6;11;6" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="15" fill="#ef4444" font-size="18" font-weight="800" letter-spacing="1">LIVE</text>
    <text x="90" y="15" fill="#5b7089" font-size="17" font-weight="600">KBO · 7회 초</text>
  </g>
  <text x="1144" y="63" text-anchor="end" fill="#33485f" font-size="16" font-weight="600" letter-spacing="2">SCOREBASE</text>

  <!-- 매치 카드 -->
  <g transform="translate(56,96)">
    <rect width="1088" height="190" rx="20" fill="url(#ls-card)" stroke="#1d2d42" stroke-opacity="0.8"/>
    <!-- 팀 A -->
    <g transform="translate(120,95)">
      <circle cx="0" cy="0" r="40" fill="#13233a" stroke="#26405e"/>
      <text x="0" y="8" text-anchor="middle" fill="#9fb6cf" font-size="26" font-weight="800">LG</text>
      <text x="0" y="78" text-anchor="middle" fill="#cdddee" font-size="20" font-weight="700">LG 트윈스</text>
    </g>
    <!-- 스코어 -->
    <g transform="translate(544,95)">
      <text x="-70" y="14" text-anchor="middle" fill="#06b6d4" font-size="58" font-weight="900">5</text>
      <text x="0" y="8" text-anchor="middle" fill="#3a5170" font-size="34" font-weight="700">:</text>
      <text x="70" y="14" text-anchor="middle" fill="#e6f0fa" font-size="58" font-weight="900">3</text>
      <rect x="-44" y="40" width="88" height="26" rx="13" fill="#06b6d4" fill-opacity="0.14"/>
      <text x="0" y="58" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">승률 68%</text>
    </g>
    <!-- 팀 B -->
    <g transform="translate(968,95)">
      <circle cx="0" cy="0" r="40" fill="#13233a" stroke="#26405e"/>
      <text x="0" y="8" text-anchor="middle" fill="#9fb6cf" font-size="24" font-weight="800">SSG</text>
      <text x="0" y="78" text-anchor="middle" fill="#cdddee" font-size="20" font-weight="700">SSG 랜더스</text>
    </g>
  </g>

  <!-- 승률 곡선 -->
  <g transform="translate(56,312)">
    <text x="4" y="0" fill="#7c93ab" font-size="16" font-weight="700">승률 곡선</text>
    <text x="1088" y="0" text-anchor="end" fill="#3a5170" font-size="14" font-weight="600">1회 → 9회</text>
    <!-- grid -->
    <g stroke="#1b2a3d" stroke-width="1">
      <line x1="0" y1="34" x2="1088" y2="34"/>
      <line x1="0" y1="84" x2="1088" y2="84"/>
      <line x1="0" y1="134" x2="1088" y2="134"/>
    </g>
    <!-- area + curve (홈팀 승률) -->
    <path d="M0,96 C120,90 200,70 320,76 C440,82 520,52 660,44 C800,36 900,30 1088,22 L1088,150 L0,150 Z" fill="url(#ls-area)"/>
    <path d="M0,96 C120,90 200,70 320,76 C440,82 520,52 660,44 C800,36 900,30 1088,22" fill="none" stroke="url(#ls-win)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 상대 곡선 (옅은 회색) -->
    <path d="M0,54 C120,60 200,80 320,74 C440,68 520,98 660,106 C800,114 900,120 1088,128" fill="none" stroke="#3a5170" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.7"/>
    <circle cx="1088" cy="22" r="6" fill="#06b6d4"/>
    <circle cx="1088" cy="22" r="11" fill="#06b6d4" opacity="0.25"/>
  </g>

  <!-- 하단 라벨 칩 -->
  <g transform="translate(56,512)">
    <g>
      <rect width="172" height="46" rx="23" fill="#0e1a2b" stroke="#26405e"/>
      <circle cx="28" cy="23" r="5" fill="#06b6d4"/>
      <text x="48" y="29" fill="#cdddee" font-size="17" font-weight="600">라인업</text>
    </g>
    <g transform="translate(196,0)">
      <rect width="210" height="46" rx="23" fill="#0e1a2b" stroke="#26405e"/>
      <circle cx="28" cy="23" r="5" fill="#06b6d4"/>
      <text x="48" y="29" fill="#cdddee" font-size="17" font-weight="600">승률 곡선</text>
    </g>
    <g transform="translate(430,0)">
      <rect width="210" height="46" rx="23" fill="#0e1a2b" stroke="#26405e"/>
      <circle cx="28" cy="23" r="5" fill="#22c55e"/>
      <text x="48" y="29" fill="#cdddee" font-size="17" font-weight="600">라이브 배당</text>
    </g>
    <g transform="translate(664,0)">
      <rect width="240" height="46" rx="23" fill="#0e1a2b" stroke="#26405e"/>
      <circle cx="28" cy="23" r="5" fill="#22c55e"/>
      <text x="48" y="29" fill="#cdddee" font-size="17" font-weight="600">타자·투수 기록</text>
    </g>
  </g>
</svg>
