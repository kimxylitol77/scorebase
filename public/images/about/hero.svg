<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="스코어베이스 — AI 스포츠 데이터 분석 미디어">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="h-accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="h-bar" x1="0" y1="1" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e7490" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="h-area" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#h-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="27.5" stroke="#1b2a3d" stroke-opacity="0.6"/>

  <!-- 로고 -->
  <g transform="translate(64,56)">
    <g transform="translate(0,2)">
      <rect x="0" y="20" width="9" height="16" rx="2" fill="#0e7490"/>
      <rect x="13" y="11" width="9" height="25" rx="2" fill="#0891b2"/>
      <rect x="26" y="4" width="9" height="32" rx="2" fill="#06b6d4"/>
      <rect x="39" y="-2" width="9" height="38" rx="2" fill="#22d3ee"/>
    </g>
    <text x="62" y="28" fill="#e6f0fa" font-size="30" font-weight="900" letter-spacing="-0.5">Scorebase</text>
  </g>

  <!-- 좌측 카피 -->
  <g transform="translate(64,180)">
    <text x="0" y="0" fill="#aebfd0" font-size="44" font-weight="700">감이 아니라,</text>
    <text x="0" y="78" fill="#ffffff" font-size="74" font-weight="900" letter-spacing="-2">숫자로 보는 경기</text>
    <rect x="2" y="104" width="150" height="9" rx="4" fill="url(#h-accent)"/>
    <text x="2" y="168" fill="#7c93ab" font-size="22" font-weight="600">Elo 모델과 멀티 AI 로 매일 분석하는 스포츠 데이터 미디어</text>
  </g>

  <!-- 종목 칩 -->
  <g transform="translate(64,420)" font-size="19" font-weight="700">
    <g><rect width="86" height="42" rx="21" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/><text x="43" y="27" text-anchor="middle" fill="#9fd3e0">축구</text></g>
    <g transform="translate(98,0)"><rect width="86" height="42" rx="21" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/><text x="43" y="27" text-anchor="middle" fill="#9fd3e0">야구</text></g>
    <g transform="translate(196,0)"><rect width="86" height="42" rx="21" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/><text x="43" y="27" text-anchor="middle" fill="#9fd3e0">농구</text></g>
    <g transform="translate(294,0)"><rect width="86" height="42" rx="21" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/><text x="43" y="27" text-anchor="middle" fill="#9fd3e0">하키</text></g>
    <g transform="translate(392,0)"><rect width="92" height="42" rx="21" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/><text x="46" y="27" text-anchor="middle" fill="#9fd3e0">LCK</text></g>
  </g>

  <!-- 우측 그래프 모티프 -->
  <g transform="translate(760,150)">
    <!-- 승률 곡선 area -->
    <path d="M0,230 C70,210 130,170 200,150 C270,130 320,90 380,70 L380,300 L0,300 Z" fill="url(#h-area)"/>
    <path d="M0,230 C70,210 130,170 200,150 C270,130 320,90 380,70" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="380" cy="70" r="6" fill="#22d3ee"/>
    <!-- 막대 -->
    <g>
      <rect x="20" y="200" width="46" height="100" rx="8" fill="url(#h-bar)"/>
      <rect x="96" y="150" width="46" height="150" rx="8" fill="url(#h-bar)"/>
      <rect x="172" y="100" width="46" height="200" rx="8" fill="url(#h-bar)"/>
      <rect x="248" y="60" width="46" height="240" rx="8" fill="url(#h-bar)"/>
      <rect x="324" y="30" width="46" height="270" rx="8" fill="url(#h-bar)"/>
    </g>
  </g>
</svg>
