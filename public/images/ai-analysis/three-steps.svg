<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ts-accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#ts-bg)"/>

  <!-- 로고 -->
  <g transform="translate(60,44)">
    <rect x="0" y="18" width="7" height="13" rx="2" fill="#0e7490"/>
    <rect x="11" y="11" width="7" height="20" rx="2" fill="#0891b2"/>
    <rect x="22" y="5" width="7" height="26" rx="2" fill="#06b6d4"/>
    <rect x="33" y="0" width="7" height="31" rx="2" fill="#22d3ee"/>
    <text x="50" y="25" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="26" font-weight="900" fill="#e6f0fa" letter-spacing="-0.5">Scorebase</text>
  </g>

  <!-- 타이틀 -->
  <text x="600" y="98" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="34" font-weight="800" fill="#e6f0fa" letter-spacing="-1">AI 스포츠 분석 3단계</text>

  <!-- 연결 화살표 -->
  <g stroke="url(#ts-accent)" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="384" y1="268" x2="430" y2="268"/>
    <line x1="764" y1="268" x2="810" y2="268"/>
  </g>
  <g fill="#22c55e">
    <polygon points="430,260 446,268 430,276"/>
    <polygon points="810,260 826,268 810,276"/>
  </g>

  <!-- ===== 카드 1: Elo 전력 수치화 ===== -->
  <g>
    <rect x="70" y="150" width="300" height="248" rx="22" fill="#06b6d4" fill-opacity="0.06" stroke="#0e7490" stroke-opacity="0.7"/>
    <circle cx="106" cy="188" r="19" fill="url(#ts-accent)"/>
    <text x="106" y="196" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="900" fill="#06222a">1</text>
    <!-- 아이콘: 상승 막대 -->
    <g transform="translate(196,210)">
      <rect x="0" y="40" width="16" height="30" rx="3" fill="#0e7490"/>
      <rect x="24" y="20" width="16" height="50" rx="3" fill="#0891b2"/>
      <rect x="48" y="4" width="16" height="66" rx="3" fill="#22d3ee"/>
    </g>
    <text x="220" y="328" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="27" font-weight="800" fill="#ffffff">Elo 전력 수치화</text>
    <text x="220" y="362" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">팀의 현재 전력을</text>
    <text x="220" y="386" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">하나의 숫자로</text>
  </g>

  <!-- ===== 카드 2: 경기 확률 계산 ===== -->
  <g>
    <rect x="450" y="150" width="300" height="248" rx="22" fill="#06b6d4" fill-opacity="0.06" stroke="#0e7490" stroke-opacity="0.7"/>
    <circle cx="486" cy="188" r="19" fill="url(#ts-accent)"/>
    <text x="486" y="196" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="900" fill="#06222a">2</text>
    <!-- 아이콘: 게이지(확률) -->
    <g transform="translate(600,244)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#14333f" stroke-width="11"/>
      <path d="M 0 -34 A 34 34 0 1 1 -34 0" fill="none" stroke="url(#ts-accent)" stroke-width="11" stroke-linecap="round"/>
    </g>
    <text x="600" y="328" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="27" font-weight="800" fill="#ffffff">경기 확률 계산</text>
    <text x="600" y="362" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">승·무·패 확률 +</text>
    <text x="600" y="386" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">홈 어드밴티지 반영</text>
  </g>

  <!-- ===== 카드 3: 시즌 시뮬레이션 ===== -->
  <g>
    <rect x="830" y="150" width="300" height="248" rx="22" fill="#06b6d4" fill-opacity="0.06" stroke="#0e7490" stroke-opacity="0.7"/>
    <circle cx="866" cy="188" r="19" fill="url(#ts-accent)"/>
    <text x="866" y="196" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="900" fill="#06222a">3</text>
    <!-- 아이콘: 겹친 사각형 = 반복 시뮬레이션 -->
    <g transform="translate(980,244)">
      <rect x="-28" y="-28" width="44" height="44" rx="9" fill="none" stroke="#0e7490" stroke-width="5"/>
      <rect x="-12" y="-12" width="44" height="44" rx="9" fill="#06b6d4" fill-opacity="0.18" stroke="#22d3ee" stroke-width="5"/>
    </g>
    <text x="980" y="328" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="27" font-weight="800" fill="#ffffff">시즌 시뮬레이션</text>
    <text x="980" y="362" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">몬테카를로 5,000회</text>
    <text x="980" y="386" text-anchor="middle" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="17" font-weight="500" fill="#9fd3e0">반복 계산</text>
  </g>
</svg>
