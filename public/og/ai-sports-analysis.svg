<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071019"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="og-curve" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- 배경: 옅은 Elo 점수 상승 곡선 (우상단) -->
  <polyline points="560,352 636,322 712,332 792,272 872,286 952,222 1036,206 1124,152"
            fill="none" stroke="url(#og-curve)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <g fill="#22d3ee" opacity="0.55">
    <circle cx="792" cy="272" r="6"/>
    <circle cx="952" cy="222" r="6"/>
    <circle cx="1124" cy="152" r="7"/>
  </g>

  <!-- 배경: 확률 막대 모티프 (우하단, 옅게) -->
  <g opacity="0.5">
    <rect x="788" y="540" width="52" height="62" rx="10" fill="#385978" fill-opacity="0.16"/>
    <rect x="852" y="486" width="52" height="116" rx="10" fill="#385978" fill-opacity="0.16"/>
    <rect x="916" y="512" width="52" height="90" rx="10" fill="#385978" fill-opacity="0.16"/>
    <rect x="980" y="440" width="52" height="162" rx="10" fill="#385978" fill-opacity="0.16"/>
    <rect x="1044" y="476" width="52" height="126" rx="10" fill="#06b6d4" fill-opacity="0.18"/>
  </g>

  <!-- 로고 -->
  <g transform="translate(72,66)">
    <rect x="0" y="22" width="9" height="16" rx="2" fill="#0e7490"/>
    <rect x="13" y="13" width="9" height="25" rx="2" fill="#0891b2"/>
    <rect x="26" y="6" width="9" height="32" rx="2" fill="#06b6d4"/>
    <rect x="39" y="0" width="9" height="38" rx="2" fill="#22d3ee"/>
    <text x="62" y="30" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="32" font-weight="900" fill="#e6f0fa" letter-spacing="-0.5">Scorebase</text>
  </g>

  <!-- 우상단 칩 -->
  <g transform="translate(968,72)" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700">
    <rect width="160" height="40" rx="20" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490"/>
    <text x="80" y="26" text-anchor="middle" fill="#9fd3e0">데이터 분석 가이드</text>
  </g>

  <!-- 중앙 카피 -->
  <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="80" y="322" font-size="38" font-weight="700" fill="#7fd6e6" letter-spacing="2">감이 아니라 데이터로,</text>
    <text x="80" y="424" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-3">AI는 경기를 어떻게 읽는가</text>
    <rect x="84" y="454" width="184" height="10" rx="5" fill="url(#og-accent)"/>
  </g>

  <!-- 하단 브랜드 -->
  <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="80" y="584" font-size="26" font-weight="700" fill="#cdddee">스코어베이스 · 데이터 스포츠 분석</text>
    <text x="1128" y="584" text-anchor="end" font-size="20" font-weight="700" fill="#33485f" letter-spacing="2">scorebase.kr</text>
  </g>
</svg>
